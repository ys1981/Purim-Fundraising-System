name: Build and test
on: [push, pull_request]
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  map-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare map data directory
        run: mkdir -p maps
      - name: Download previously verified offline map artifact
        uses: actions/download-artifact@v4
        with:
          name: israel-offline-map
          run-id: 45937814655
          github-token: ${{ github.token }}
          path: maps
      - name: Verify map package
        run: |
          test -s maps/israel.mbtiles
          sudo apt-get update
          sudo apt-get install -y sqlite3
          sqlite3 maps/israel.mbtiles "SELECT COUNT(*) FROM tiles;"
          sqlite3 maps/israel.mbtiles "PRAGMA integrity_check;"
      - uses: actions/upload-artifact@v4
        with:
          name: israel-offline-map
          path: maps/israel.mbtiles
          if-no-files-found: error
          retention-days: 90
  test:
    needs: map-data
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: israel-offline-map
          path: maps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm rebuild better-sqlite3
      - run: node --check src/main.cjs && node --check src/preload.cjs && node --check src/store.cjs && node --check src/security.cjs && node --check src/renderer.js && node --check src/map-view.js
      - run: npm test
      - name: Rebuild native modules for the packaged Electron runtime
        run: npx electron-builder install-app-deps
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Purim-Fundraising-System-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
